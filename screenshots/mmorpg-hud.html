<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MMORPG HUD</title>
<style>
  html, body { margin: 0; background: #0c0a08; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const c = document.getElementById("c");
const g = c.getContext("2d");
const W = 1920, H = 1080;

function rr(x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function goldFrame(x, y, w, h, r) {
  rr(x, y, w, h, r);
  const grd = g.createLinearGradient(x, y, x, y + h);
  grd.addColorStop(0, "rgba(18,14,10,0.82)");
  grd.addColorStop(1, "rgba(8,6,4,0.88)");
  g.fillStyle = grd;
  g.fill();
  g.lineWidth = 2;
  g.strokeStyle = "#c9a15b";
  g.stroke();
  g.lineWidth = 1;
  g.strokeStyle = "rgba(255,236,190,0.35)";
  rr(x + 3, y + 3, w - 6, h - 6, Math.max(2, r - 2));
  g.stroke();
}
function cloud(x, y, s) {
  g.fillStyle = "rgba(255,255,255,0.72)";
  g.beginPath();
  g.ellipse(x, y, 70 * s, 22 * s, 0, 0, 7);
  g.ellipse(x + 40 * s, y - 10 * s, 48 * s, 26 * s, 0, 0, 7);
  g.ellipse(x - 36 * s, y - 6 * s, 40 * s, 20 * s, 0, 0, 7);
  g.fill();
}
function building(x, y, w, h, roof, win) {
  g.fillStyle = "#6d6258";
  g.fillRect(x, y, w, h);
  g.fillStyle = "rgba(0,0,0,0.18)";
  g.fillRect(x + w - 10, y, 10, h);
  g.fillStyle = roof;
  g.beginPath();
  g.moveTo(x - 10, y);
  g.lineTo(x + w / 2, y - h * 0.42);
  g.lineTo(x + w + 10, y);
  g.closePath();
  g.fill();
  g.strokeStyle = "rgba(40,20,12,0.45)";
  g.stroke();
  for (let i = 0; i < 2; i++) {
    for (let j = 0; j < 2; j++) {
      const wx = x + 14 + i * (w * 0.42);
      const wy = y + 18 + j * (h * 0.32);
      g.fillStyle = win;
      g.fillRect(wx, wy, 16, 22);
      g.strokeStyle = "#3a2a1c";
      g.strokeRect(wx, wy, 16, 22);
    }
  }
  g.fillStyle = "#3a2618";
  g.fillRect(x + w / 2 - 12, y + h - 36, 24, 36);
}
function person(x, y, scale, robe, hair, facing) {
  g.save();
  g.translate(x, y);
  g.scale(scale, scale);
  g.fillStyle = "rgba(0,0,0,0.25)";
  g.beginPath();
  g.ellipse(0, 2, 16, 5, 0, 0, 7);
  g.fill();
  g.fillStyle = robe;
  g.fillRect(-10, -46, 20, 40);
  g.fillStyle = hair;
  g.beginPath();
  g.arc(facing * 2, -58, 9, 0, 7);
  g.fill();
  g.fillStyle = "#c4a07a";
  g.fillRect(-3, -52, 7, 8);
  g.restore();
}
function warrior(x, y) {
  g.save();
  g.translate(x, y);
  g.fillStyle = "rgba(0,0,0,0.35)";
  g.beginPath();
  g.ellipse(0, 8, 46, 12, 0, 0, 7);
  g.fill();
  // cape
  g.fillStyle = "#6e1c22";
  g.beginPath();
  g.moveTo(-28, -118);
  g.quadraticCurveTo(-46, -40, -22, 4);
  g.lineTo(22, 4);
  g.quadraticCurveTo(46, -40, 28, -118);
  g.closePath();
  g.fill();
  g.fillStyle = "#8d242c";
  g.beginPath();
  g.moveTo(-6, -110);
  g.lineTo(8, -20);
  g.lineTo(-4, 2);
  g.lineTo(-14, -30);
  g.closePath();
  g.fill();
  // legs
  const leg = g.createLinearGradient(-16, -40, 16, 8);
  leg.addColorStop(0, "#8d97a4");
  leg.addColorStop(1, "#3e4652");
  g.fillStyle = leg;
  g.fillRect(-16, -42, 13, 48);
  g.fillRect(3, -42, 13, 48);
  g.fillStyle = "#2a241c";
  g.fillRect(-16, -2, 13, 8);
  g.fillRect(3, -2, 13, 8);
  // torso plate
  const plate = g.createLinearGradient(-26, -130, 26, -40);
  plate.addColorStop(0, "#d5dde6");
  plate.addColorStop(0.45, "#8e99a8");
  plate.addColorStop(1, "#4c5562");
  g.fillStyle = plate;
  rr(-24, -128, 48, 90, 8);
  g.fill();
  g.strokeStyle = "#c9a15b";
  g.lineWidth = 2;
  g.stroke();
  g.beginPath();
  g.moveTo(0, -120);
  g.lineTo(0, -46);
  g.strokeStyle = "rgba(255,236,190,0.55)";
  g.stroke();
  // pauldrons
  g.fillStyle = "#9aa4b2";
  g.beginPath();
  g.ellipse(-28, -112, 18, 12, -0.4, 0, 7);
  g.ellipse(28, -112, 18, 12, 0.4, 0, 7);
  g.fill();
  g.strokeStyle = "#e8c97a";
  g.stroke();
  // arms
  g.fillStyle = "#6d7684";
  g.fillRect(-38, -108, 12, 42);
  g.fillRect(26, -108, 12, 42);
  g.fillStyle = "#c9a15b";
  g.fillRect(-40, -72, 16, 8);
  g.fillRect(24, -72, 16, 8);
  // helmet
  const helm = g.createLinearGradient(-16, -168, 16, -128);
  helm.addColorStop(0, "#e7eef6");
  helm.addColorStop(1, "#66707e");
  g.fillStyle = helm;
  g.beginPath();
  g.arc(0, -140, 20, Math.PI, 0);
  g.lineTo(16, -124);
  g.lineTo(-16, -124);
  g.closePath();
  g.fill();
  g.fillStyle = "#b8893a";
  g.beginPath();
  g.moveTo(0, -168);
  g.lineTo(6, -146);
  g.lineTo(-6, -146);
  g.closePath();
  g.fill();
  // sword on back
  g.save();
  g.translate(10, -150);
  g.rotate(0.35);
  g.fillStyle = "#d7dee8";
  g.fillRect(-3, 0, 6, 78);
  g.fillStyle = "#c9a15b";
  g.fillRect(-12, 70, 24, 5);
  g.fillStyle = "#3a2414";
  g.fillRect(-3, 75, 6, 16);
  g.restore();
  g.restore();
}

function sky() {
  const sky = g.createLinearGradient(0, 0, 0, 620);
  sky.addColorStop(0, "#6aa4d4");
  sky.addColorStop(0.45, "#b7cfe4");
  sky.addColorStop(0.72, "#e6d3b4");
  sky.addColorStop(1, "#c4b49a");
  g.fillStyle = sky;
  g.fillRect(0, 0, W, H);
  cloud(280, 90, 1.3);
  cloud(640, 60, 0.9);
  cloud(1100, 110, 1.5);
  cloud(1540, 70, 1.1);
  cloud(900, 150, 0.7);
  // distant hills
  g.fillStyle = "#8ea07a";
  g.beginPath();
  g.moveTo(0, 430);
  g.quadraticCurveTo(300, 360, 620, 420);
  g.quadraticCurveTo(980, 340, 1400, 410);
  g.quadraticCurveTo(1700, 370, 1920, 430);
  g.lineTo(1920, 560);
  g.lineTo(0, 560);
  g.fill();
}
function town() {
  // ground
  const ground = g.createLinearGradient(0, 480, 0, 980);
  ground.addColorStop(0, "#b7a48a");
  ground.addColorStop(1, "#6d5c48");
  g.fillStyle = ground;
  g.fillRect(0, 500, W, 580);
  // plaza stones
  g.strokeStyle = "rgba(70,55,40,0.25)";
  g.lineWidth = 1;
  for (let i = 0; i < 14; i++) {
    const y = 540 + i * 28;
    const inset = i * 18;
    g.beginPath();
    g.moveTo(200 + inset, y);
    g.lineTo(1720 - inset, y);
    g.stroke();
  }
  // buildings left
  building(40, 360, 150, 190, "#7a3030", "#f2d48a");
  building(180, 330, 170, 220, "#5c4030", "#efe0b0");
  building(340, 380, 130, 170, "#6a2830", "#f4e2a8");
  // right
  building(1380, 350, 180, 210, "#6e2c34", "#f6e6b4");
  building(1560, 390, 140, 170, "#4e382c", "#efe0b0");
  building(1690, 340, 190, 220, "#7a3830", "#fff1c4");
  // well
  g.fillStyle = "#5c5348";
  g.beginPath();
  g.ellipse(980, 560, 54, 18, 0, 0, 7);
  g.fill();
  g.strokeStyle = "#c9a15b";
  g.lineWidth = 3;
  g.stroke();
  g.strokeStyle = "#3a3228";
  g.beginPath();
  g.moveTo(940, 560);
  g.lineTo(940, 500);
  g.lineTo(1020, 500);
  g.lineTo(1020, 560);
  g.stroke();
  // stalls
  g.fillStyle = "#8d3a32";
  g.beginPath();
  g.moveTo(620, 520);
  g.lineTo(760, 500);
  g.lineTo(760, 530);
  g.lineTo(620, 548);
  g.fill();
  g.fillStyle = "#6a4a30";
  g.fillRect(640, 548, 100, 28);
  g.fillStyle = "#c9a15b";
  g.fillRect(655, 540, 14, 10);
  g.fillRect(678, 536, 12, 12);
  // banners
  g.fillStyle = "#1e3f78";
  g.fillRect(520, 300, 16, 90);
  g.fillStyle = "#f2e6c8";
  g.font = "11px Georgia";
  g.save();
  g.translate(528, 340);
  g.rotate(-Math.PI / 2);
  g.fillText("MARKET", 0, 4);
  g.restore();
  // npcs
  person(700, 640, 1.15, "#2f4a38", "#2a2018", 1);
  person(820, 670, 1, "#4a3038", "#1a120e", -1);
  person(1120, 650, 1.1, "#3a4060", "#c8b090", 1);
  person(1240, 690, 0.95, "#5a4632", "#3a2418", -1);
  person(560, 700, 0.9, "#6a3030", "#201610", 1);
  person(1360, 640, 1.05, "#243048", "#d8c8a8", -1);
  person(460, 620, 0.85, "#3e4a32", "#1a140e", 1);
  person(1500, 680, 0.9, "#5a2840", "#c4a888", -1);
}
function orb(x, y, pct, label) {
  const r = 46;
  g.save();
  g.translate(x, y);
  // metal ring
  const ring = g.createRadialGradient(-8, -10, 10, 0, 0, r + 8);
  ring.addColorStop(0, "#f4e2b0");
  ring.addColorStop(0.45, "#b8893a");
  ring.addColorStop(1, "#5c4018");
  g.beginPath();
  g.arc(0, 0, r + 7, 0, 7);
  g.fillStyle = ring;
  g.fill();
  g.beginPath();
  g.arc(0, 0, r, 0, 7);
  g.fillStyle = "#102033";
  g.fill();
  g.save();
  g.beginPath();
  g.arc(0, 0, r - 2, 0, 7);
  g.clip();
  const h = (r * 2 - 6) * pct;
  const liq = g.createLinearGradient(0, r, 0, r - h);
  liq.addColorStop(0, "#1d6ec4");
  liq.addColorStop(0.6, "#49b4ff");
  liq.addColorStop(1, "#d7f4ff");
  g.fillStyle = liq;
  g.fillRect(-r, r - h, r * 2, h + 4);
  g.fillStyle = "rgba(255,255,255,0.28)";
  g.beginPath();
  g.ellipse(-12, -16, 10, 18, -0.4, 0, 7);
  g.fill();
  g.restore();
  g.fillStyle = "#f6edd8";
  g.font = "bold 13px Georgia";
  g.textAlign = "center";
  g.fillText(label, 0, r + 24);
  g.restore();
}
function bar(x, y, w, label, color, ratio) {
  goldFrame(x, y, w, 28, 6);
  g.save();
  rr(x + 6, y + 5, (w - 12) * ratio, 18, 4);
  g.clip();
  const grd = g.createLinearGradient(x, y, x, y + 28);
  grd.addColorStop(0, "#fff");
  grd.addColorStop(0.35, color);
  grd.addColorStop(1, color);
  g.globalAlpha = 0.95;
  g.fillStyle = color;
  g.fillRect(x + 6, y + 5, (w - 12) * ratio, 18);
  g.fillStyle = "rgba(255,255,255,0.28)";
  g.fillRect(x + 6, y + 5, (w - 12) * ratio, 6);
  g.restore();
  g.fillStyle = "#f7f1e4";
  g.font = "bold 14px Georgia";
  g.textAlign = "center";
  g.fillText(label, x + w / 2, y + 19);
}
function icon(kind, x, y) {
  g.save();
  g.translate(x, y);
  if (kind === "char") {
    g.fillStyle = "#e8d7b0";
    g.beginPath();
    g.arc(0, -6, 7, 0, 7);
    g.fill();
    g.fillRect(-8, 3, 16, 10);
  } else if (kind === "bag") {
    g.strokeStyle = "#e8d7b0";
    g.lineWidth = 2;
    g.strokeRect(-8, -2, 16, 14);
    g.beginPath();
    g.arc(0, -2, 5, Math.PI, 0);
    g.stroke();
    g.fillStyle = "#f0d060";
    g.beginPath();
    g.arc(4, 8, 3, 0, 7);
    g.fill();
  } else if (kind === "gear") {
    g.strokeStyle = "#e8d7b0";
    g.lineWidth = 2;
    g.beginPath();
    g.arc(0, 0, 6, 0, 7);
    g.stroke();
    g.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * Math.PI * 2;
      g.moveTo(Math.cos(a) * 6, Math.sin(a) * 6);
      g.lineTo(Math.cos(a) * 10, Math.sin(a) * 10);
    }
    g.stroke();
  } else if (kind === "skill") {
    g.fillStyle = "#7ec8ff";
    g.beginPath();
    g.moveTo(0, -10);
    g.lineTo(8, 8);
    g.lineTo(-8, 8);
    g.fill();
  }
  g.restore();
}
function skillSlot(x, y, key, hue) {
  goldFrame(x, y, 52, 52, 6);
  g.fillStyle = `hsl(${hue} 42% 28%)`;
  rr(x + 6, y + 6, 40, 28, 4);
  g.fill();
  g.fillStyle = `hsl(${hue} 70% 62%)`;
  g.beginPath();
  g.arc(x + 26, y + 20, 8, 0, 7);
  g.fill();
  g.fillStyle = "#f6edd8";
  g.font = "bold 11px Georgia";
  g.textAlign = "center";
  g.fillText(key, x + 26, y + 46);
}
function minimap() {
  const cx = 1768, cy = 118, r = 78;
  g.save();
  g.beginPath();
  g.arc(cx, cy, r + 8, 0, 7);
  const ring = g.createLinearGradient(cx, cy - r, cx, cy + r);
  ring.addColorStop(0, "#f3e2b0");
  ring.addColorStop(1, "#8a6428");
  g.fillStyle = ring;
  g.fill();
  g.beginPath();
  g.arc(cx, cy, r, 0, 7);
  g.fillStyle = "#1c3a28";
  g.fill();
  g.save();
  g.beginPath();
  g.arc(cx, cy, r, 0, 7);
  g.clip();
  g.strokeStyle = "rgba(180,160,90,0.35)";
  g.strokeRect(cx - 40, cy - 20, 70, 18);
  g.strokeRect(cx - 10, cy + 8, 40, 28);
  g.fillStyle = "#6a8f62";
  g.fillRect(cx - 60, cy - 50, 30, 90);
  g.fillStyle = "#d2b15a";
  g.beginPath();
  g.arc(cx, cy, 4, 0, 7);
  g.fill();
  g.fillStyle = "#7eb6ff";
  g.fillRect(cx - 18, cy + 22, 5, 5);
  g.fillStyle = "#ffb45a";
  g.fillRect(cx + 22, cy - 16, 5, 5);
  g.restore();
  g.fillStyle = "#f6edd8";
  g.font = "bold 12px Georgia";
  g.textAlign = "center";
  g.fillText("N", cx, cy - r + 16);
  g.fillText("S", cx, cy + r - 6);
  g.textAlign = "left";
  g.fillText("E", cx + r - 16, cy + 4);
  g.fillText("W", cx - r + 6, cy + 4);
  g.restore();
}
function quests() {
  goldFrame(1388, 28, 280, 168, 8);
  g.fillStyle = "#e8c97a";
  g.font = "bold 15px Georgia";
  g.textAlign = "left";
  g.fillText("Quest Tracker", 1404, 52);
  const lines = [
    ["Night Watch", "12 / 20"],
    ["Well of Embers", "Talk"],
    ["Smith's Trial", "0 / 1"],
    ["Meadow Beast", "Track"],
  ];
  lines.forEach((row, i) => {
    const y = 78 + i * 28;
    g.fillStyle = "#f4ecdc";
    g.font = "14px Georgia";
    g.fillText(row[0], 1404, y);
    g.fillStyle = "#8fd0ff";
    g.textAlign = "right";
    g.fillText(row[1], 1652, y);
    g.textAlign = "left";
  });
}
function party() {
  const names = ["You", "Aria", "Bram"];
  names.forEach((name, i) => {
    const y = 24 + i * 58;
    goldFrame(20, y, 250, 52, 8);
    g.fillStyle = "#3a2a22";
    rr(30, y + 8, 36, 36, 6);
    g.fill();
    g.fillStyle = i === 0 ? "#d8c4a4" : "#c4a07a";
    g.beginPath();
    g.arc(48, y + 22, 8, 0, 7);
    g.fill();
    g.fillStyle = "#6d7684";
    g.fillRect(40, y + 30, 16, 8);
    g.fillStyle = "#f6edd8";
    g.font = "bold 13px Georgia";
    g.textAlign = "left";
    g.fillText(name, 76, y + 22);
    g.fillStyle = "#8a2e2e";
    g.fillRect(76, y + 30, 120, 8);
    g.fillStyle = "#c4473c";
    g.fillRect(76, y + 30, i === 2 ? 70 : 110, 8);
    g.fillStyle = "#2a4e86";
    g.fillRect(200, y + 30, 54, 8);
    g.fillStyle = "#4d86d4";
    g.fillRect(200, y + 30, i === 1 ? 40 : 54, 8);
  });
}
function menus() {
  const tabs = [
    { t: "System", k: "gear", x: 1560, y: 760, w: 150 },
    { t: "Skills", k: "skill", x: 1720, y: 760, w: 150 },
    { t: "Character", k: "char", x: 1560, y: 818, w: 310 },
    { t: "Inventory", k: "bag", x: 1560, y: 878, w: 310 },
  ];
  tabs.forEach((tab) => {
    goldFrame(tab.x, tab.y, tab.w, tab.t.length > 8 ? 52 : 48, 8);
    icon(tab.k, tab.x + 28, tab.y + 24);
    g.fillStyle = "#f6edd8";
    g.font = "bold 18px Georgia";
    g.textAlign = "left";
    g.fillText(tab.t, tab.x + 52, tab.y + 30);
  });
  goldFrame(1560, 940, 148, 40, 8);
  goldFrame(1718, 940, 148, 40, 8);
  g.fillStyle = "#e8c97a";
  g.font = "bold 16px Georgia";
  g.textAlign = "center";
  g.fillText("Mone", 1634, 966);
  g.fillText("Func", 1792, 966);
}
function hud() {
  // xp orbs
  const labels = ["65.5% XP", "67.5% XP", "15.5% XP", "0.9% XP"];
  const fills = [0.655, 0.675, 0.155, 0.09];
  labels.forEach((lb, i) => orb(90 + i * 120, 860, fills[i], lb));
  bar(24, 960, 470, "HP: 1850/2100", "#c4473c", 1850 / 2100);
  bar(24, 994, 470, "MP: 700/700", "#3d6cb8", 1);
  bar(24, 1028, 470, "SP: 120/120", "#3c9a4e", 1);
  // hotbar
  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "F1", "F2", "F3", "F4"];
  keys.forEach((k, i) => skillSlot(620 + i * 58, 1004, k, 18 + i * 26));
  minimap();
  quests();
  party();
  menus();
  // zone name
  g.fillStyle = "rgba(12,10,8,0.55)";
  rr(860, 24, 200, 32, 8);
  g.fill();
  g.strokeStyle = "#c9a15b";
  g.stroke();
  g.fillStyle = "#f6edd8";
  g.font = "14px Georgia";
  g.textAlign = "center";
  g.fillText("Town Square", 960, 45);
}

sky();
town();
warrior(960, 760);
// slight vignette
const vig = g.createRadialGradient(960, 520, 280, 960, 540, 980);
vig.addColorStop(0, "rgba(0,0,0,0)");
vig.addColorStop(1, "rgba(0,0,0,0.28)");
g.fillStyle = vig;
g.fillRect(0, 0, W, H);
hud();
window.__ready = true;
</script>
</body>
</html>
